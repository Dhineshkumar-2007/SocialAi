<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SocialSolve</title><link rel="stylesheet" href="/static/css/socialsolve.css"></head><body style="background:#f6f8fb">
{% include 'components/navbar.html' %}<main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section style="width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:32px;box-shadow:0 20px 60px #17203310"><div class="muted">SOCIALSOLVE</div><h1>Sign in</h1><p class="muted">Use one account to report, track, receive or work on challenges.</p><div id="msg" style="display:none;padding:10px;border-radius:10px;margin:14px 0"></div><form id="f"><label>Email</label><input id="email" type="email" required style="width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box"><label>Password</label><input id="password" type="password" required style="width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box"><button class="btn btn-primary" style="width:100%">Sign in</button></form><p style="margin-top:18px">New here? <a href="/register">Create an account</a></p></section></main><script>const f=document.getElementById('f'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value}),credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.user.role==='university'?'/university':'/citizen';}catch(x){m.style.display='block';m.style.background='#fef2f2';m.style.color='#991b1b';m.textContent=x.message}}</script></body></html>
