<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Problems · Social AI</title><link rel="stylesheet" href="/static/css/social-ai.css"></head>
<body>
<div class="app">
<aside class="side"><a class="logo" href="/"><span class="logo-mark">S</span>Social AI</a><nav><a href="/">Home</a><a class="active" href="/explore">Explore Problems</a><a href="/explore/solutions">Solutions</a><a href="/institutions">Institutions</a><a href="/impact">Impact</a></nav></aside>
<main class="main">
<div class="top"><div><h1>Explore Problems</h1><p id="sub">Loading community-reported issues…</p></div><a class="btn btn-primary" href="/citizen/submit">Report a Problem</a></div>

<div class="panel" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <input id="search" type="text" placeholder="Search problems…" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit" oninput="filterCards()">
  <select id="catFilter" onchange="filterCards()" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit">
    <option value="">All categories</option>
  </select>
  <select id="statusFilter" onchange="filterCards()" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit">
    <option value="">All statuses</option>
    <option value="submitted">Submitted</option>
    <option value="analyzed">Analyzed</option>
    <option value="assigned">Assigned</option>
    <option value="in_progress">In Progress</option>
    <option value="completed">Completed</option>
  </select>
</div>

<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px"></div>
<div id="empty" class="empty" style="display:none">No problems match your search.</div>
</main></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

let all = [];

const statusLabel = {
  submitted: 'Submitted', analyzed: 'Analyzed', assigned: 'Assigned',
  in_progress: 'In Progress', completed: 'Completed',
};
const statusCls = {
  submitted: 'amber', analyzed: 'blue', assigned: 'amber',
  in_progress: 'blue', completed: 'green',
};
const priorityCls = { critical: 'red', high: 'orange', medium: 'amber', low: '' };

function card(p) {
  return `<a href="/citizen/problems/${p.id}" style="text-decoration:none">
    <div class="panel" style="cursor:pointer;transition:box-shadow .15s">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div style="flex:1;min-width:0">
          <h3 style="font-size:15px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title)}</h3>
          <p style="font-size:12px;color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.description || '')}</p>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <span class="tag">${esc(p.category || 'General')}</span>
        <span class="tag ${statusCls[p.status] || ''}">${statusLabel[p.status] || p.status || ''}</span>
        ${p.priority_level ? `<span class="tag ${priorityCls[p.priority_level] || ''}">${p.priority_level} priority</span>` : ''}
      </div>
      <p class="muted" style="font-size:11px;margin:8px 0 0">
        ${p.address ? esc(p.address) + ' · ' : ''}${esc((p.created_at || '').slice(0,10))}
      </p>
    </div></a>`;
}

function filterCards() {
  const q = $('#search').value.toLowerCase();
  const cat = $('#catFilter').value;
  const status = $('#statusFilter').value;
  const filtered = all.filter(p =>
    (!q || p.title.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)) &&
    (!cat || p.category === cat) && (!status || p.status === status)
  );
  $('#grid').innerHTML = filtered.map(card).join('');
  $('#empty').style.display = filtered.length ? 'none' : 'block';
}

async function init() {
  try {
    const r = await fetch('/api/explore/problems');
    all = await r.json();
    const cats = [...new Set(all.map(p => p.category).filter(Boolean))].sort();
    $('#catFilter').innerHTML = '<option value="">All categories</option>' +
      cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('#sub').textContent = `${all.length} reported problem${all.length!==1?'s':''}`;
    filterCards();
  } catch(e) {
    $('#sub').textContent = 'Failed to load problems.';
  }
}
init();
</script>
</body></html>
