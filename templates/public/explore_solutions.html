<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solutions · SocialSolve</title><link rel="stylesheet" href="/static/css/socialsolve.css"></head>
<body><div class="app"><aside class="side"><a class="logo" href="/"><span class="logo-mark">S</span>SocialSolve</a><nav><a href="/">Home</a><a href="/explore">Explore Problems</a><a class="active" href="/explore/solutions">Solutions</a><a href="/institutions">Institutions</a><a href="/impact">Impact</a></nav></aside>
<main class="main"><div class="top"><h1>Verified Solutions</h1><p>Projects completed by institutions — with milestone progress and verified outcomes.</p></div><div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px"></div></main></div>
<script>
(async () => {
  try {
    const d = await (await fetch('/api/explore/solutions')).json();
    document.getElementById('list').innerHTML = d.map(s => `<a href="/citizen/problems/${s.problem_id}" style="text-decoration:none"><div class="panel">
      <h3 style="margin:0 0 6px">${s.name || s.problem_title || 'Solution'}</h3>
      <p style="font-size:13px;color:var(--muted);margin:0">Status: <strong>${s.status || ''}</strong> · Institution: ${s.institution_name || '—'}</p>
      <p style="font-size:12px;color:var(--muted);margin-top:6px">${s.problem_title ? (s.problem_title + ' · ') : ''}${s.category || ''}</p>
      <div style="margin-top:10px"><span class="tag green">Completed</span></div>
    </div></a>`).join('');
  } catch(e) { document.getElementById('list').innerHTML = '<p class="muted">Failed to load solutions.</p>'; }
})();
</script></body></html>
