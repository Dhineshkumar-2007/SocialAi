<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report Problem · Social AI</title>

    <link
        rel="stylesheet"
        href="/static/css/social-ai.css">

    <style>

        .report-box {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        #cameraPreview {
            width: 100%;
            max-height: 300px;
            border-radius: 10px;
            background: #000;
            object-fit: cover;
            margin-top: 10px;
        }

        .location-box {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #map {
            height: 300px;
            margin-top: 15px;
            display: none;
        }

        #result {
            margin-top: 20px;
        }

        .success-box,
        .error-box {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .success-box {
            background: #e8f7ed;
            border: 1px solid #a8ddb8;
        }

        .error-box {
            background: #fdecec;
            border: 1px solid #efaaaa;
        }

    </style>

</head>


<body>

<div class="app">

    <main class="main">

        <div class="report-box panel">

            <h1>Report a Community Problem</h1>

            <p>
                Submit the problem and Social AI will analyze it
                and find suitable institutions.
            </p>


            <form
                id="problemForm"
                enctype="multipart/form-data">


                <!-- ==================================================
                     TITLE
                     ================================================== -->

                <div class="field">

                    <label for="title">
                        Problem Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Streetlights not working near bus stop"
                        required>

                </div>


                <!-- ==================================================
                     DESCRIPTION
                     ================================================== -->

                <div class="field">

                    <label for="description">
                        What is happening?
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the problem, location and people affected..."
                        required></textarea>

                </div>


                <!-- ==================================================
                     IMAGE / EVIDENCE
                     ================================================== -->

                <div class="field">

                    <label>
                        Evidence Photo
                    </label>


                    <div class="buttons">


                        <!-- CAMERA BUTTON -->

                        <button
                            type="button"
                            id="cameraBtn"
                            class="btn btn-ghost">

                            📷 Camera

                        </button>


                        <!-- GALLERY BUTTON -->

                        <button
                            type="button"
                            id="uploadBtn"
                            class="btn btn-ghost">

                            🖼️ Gallery

                        </button>

                    </div>


                    <!--
                        IMPORTANT:

                        Gallery input has NO capture attribute.

                        Therefore the website asks for a normal
                        gallery/file picker.

                        Camera input has capture="environment"
                        and is ONLY triggered by Camera.
                    -->


                    <!-- GALLERY / FILE PICKER -->

                    <input
                        type="file"
                        id="evidenceInput"
                        name="evidence"
                        accept="image/jpeg,image/png,image/webp"
                        multiple
                        hidden>


                    <!-- NATIVE CAMERA FALLBACK -->

                    <input
                        type="file"
                        id="cameraInput"
                        accept="image/*"
                        capture="environment"
                        hidden>


                    <!-- LIVE CAMERA -->

                    <video
                        id="cameraPreview"
                        autoplay
                        playsinline
                        muted
                        hidden>
                    </video>


                    <!-- CAMERA CONTROLS -->

                    <div class="buttons">

                        <button
                            type="button"
                            id="captureBtn"
                            class="btn btn-primary"
                            hidden>

                            📸 Capture Photo

                        </button>


                        <button
                            type="button"
                            id="stopCameraBtn"
                            class="btn btn-ghost"
                            hidden>

                            ✋ Stop Camera

                        </button>

                    </div>


                    <!-- IMAGE PREVIEW -->

                    <div
                        id="preview"
                        class="preview">
                    </div>

                </div>


                <!-- ==================================================
                     LOCATION
                     ================================================== -->

                <div class="field">

                    <label>
                        📍 Problem Location
                    </label>


                    <div class="location-box">


                        <button
                            type="button"
                            id="locationBtn"
                            class="btn btn-ghost">

                            📍 Detect My Location

                        </button>


                        <button
                            type="button"
                            id="mapBtn"
                            class="btn btn-ghost">

                            🗺️ Choose on Map

                        </button>


                        <p id="locationText">
                            Location not selected
                        </p>

                    </div>


                    <!-- LOCATION DATA -->

                    <input
                        type="hidden"
                        name="latitude"
                        id="latitude">


                    <input
                        type="hidden"
                        name="longitude"
                        id="longitude">


                    <input
                        type="hidden"
                        name="address"
                        id="address">


                    <div id="map"></div>

                </div>


                <!-- ==================================================
                     SUBMIT
                     ================================================== -->

                <button
                    type="submit"
                    id="submitBtn"
                    class="btn btn-primary">

                    Submit & Analyze

                </button>

            </form>


            <!-- ==================================================
                 RESULT
                 ================================================== -->

            <div id="result"></div>

        </div>

    </main>

</div>


<script>


/* ================================================================
   ELEMENTS
   ================================================================ */


const form =
    document.getElementById("problemForm");


const cameraBtn =
    document.getElementById("cameraBtn");


const uploadBtn =
    document.getElementById("uploadBtn");


const cameraInput =
    document.getElementById("cameraInput");


const evidenceInput =
    document.getElementById("evidenceInput");


const preview =
    document.getElementById("preview");


const cameraPreview =
    document.getElementById("cameraPreview");


const captureBtn =
    document.getElementById("captureBtn");


const stopCameraBtn =
    document.getElementById("stopCameraBtn");


const locationBtn =
    document.getElementById("locationBtn");


const latitude =
    document.getElementById("latitude");


const longitude =
    document.getElementById("longitude");


const address =
    document.getElementById("address");


const locationText =
    document.getElementById("locationText");


const result =
    document.getElementById("result");


let cameraStream = null;


/* ================================================================
   DEVICE DETECTION
   ================================================================ */


const isMobile =
    /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i
    .test(navigator.userAgent);


/* ================================================================
   GALLERY / FILE UPLOAD
   ================================================================ */


uploadBtn.addEventListener("click", () => {

    /*
     * IMPORTANT:
     *
     * This input does NOT have capture="environment".
     *
     * Therefore this button only opens the normal
     * gallery/file picker.
     */

    evidenceInput.click();

});


evidenceInput.addEventListener("change", () => {

    showImages(evidenceInput.files);

});


/* ================================================================
   CAMERA BUTTON
   ================================================================ */


cameraBtn.addEventListener("click", async () => {

    await openCamera();

});


/* ================================================================
   OPEN CAMERA
   ================================================================ */


async function openCamera() {


    // Stop previous camera session

    stopCamera();


    /*
     * Try browser camera first.
     *
     * This gives us:
     *
     * Camera preview
     * Capture button
     * Rear camera on mobile
     */

    if (
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
    ) {

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },

                    audio: false

                });


            cameraPreview.srcObject =
                cameraStream;


            cameraPreview.hidden =
                false;


            captureBtn.hidden =
                false;


            stopCameraBtn.hidden =
                false;


            await cameraPreview.play();


            return;

        }

        catch (error) {

            console.log(
                "Browser camera unavailable:",
                error
            );

        }

    }


    /*
     * FALLBACK
     *
     * Only the Camera button reaches here.
     *
     * Gallery button never calls cameraInput.click().
     */

    if (isMobile) {

        cameraInput.click();

    }

    else {

        alert(
            "Could not access the camera. Please use the Gallery button."
        );

    }

}


/* ================================================================
   CAPTURE PHOTO FROM LIVE CAMERA
   ================================================================ */


captureBtn.addEventListener("click", () => {


    if (
        !cameraPreview.videoWidth ||
        !cameraPreview.videoHeight
    ) {

        return;

    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        cameraPreview.videoWidth;


    canvas.height =
        cameraPreview.videoHeight;


    const context =
        canvas.getContext("2d");


    context.drawImage(
        cameraPreview,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(

        blob => {


            if (!blob) {

                return;

            }


            const file =
                new File(

                    [blob],

                    `camera_${Date.now()}.jpg`,

                    {
                        type: "image/jpeg"
                    }

                );


            /*
             * Preserve already selected gallery images.
             */

            const dataTransfer =
                new DataTransfer();


            for (
                const existingFile
                of evidenceInput.files
            ) {

                dataTransfer.items.add(
                    existingFile
                );

            }


            /*
             * Add newly captured image.
             */

            dataTransfer.items.add(file);


            evidenceInput.files =
                dataTransfer.files;


            /*
             * Show preview.
             */

            showImages(
                evidenceInput.files
            );


            /*
             * Automatically stop camera
             * after successful capture.
             */

            stopCamera();

        },

        "image/jpeg",

        0.90

    );

});


/* ================================================================
   NATIVE CAMERA FALLBACK
   ================================================================ */


cameraInput.addEventListener("change", () => {


    if (!cameraInput.files.length) {

        return;

    }


    /*
     * Preserve existing gallery images.
     */

    const dataTransfer =
        new DataTransfer();


    for (
        const existingFile
        of evidenceInput.files
    ) {

        dataTransfer.items.add(
            existingFile
        );

    }


    /*
     * Add camera image.
     */

    for (
        const cameraFile
        of cameraInput.files
    ) {

        dataTransfer.items.add(
            cameraFile
        );

    }


    evidenceInput.files =
        dataTransfer.files;


    showImages(
        evidenceInput.files
    );


    /*
     * Clear camera input so the same photo
     * can be selected again if needed.
     */

    cameraInput.value = "";

});


/* ================================================================
   STOP CAMERA
   ================================================================ */


stopCameraBtn.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {


    if (cameraStream) {


        cameraStream
            .getTracks()
            .forEach(track => {

                track.stop();

            });


        cameraStream = null;

    }


    if (cameraPreview.srcObject) {

        cameraPreview.srcObject =
            null;

    }


    cameraPreview.hidden =
        true;


    captureBtn.hidden =
        true;


    stopCameraBtn.hidden =
        true;

}


/* ================================================================
   IMAGE PREVIEW
   ================================================================ */


function showImages(files) {


    preview.innerHTML = "";


    for (const file of files) {


        if (
            !file.type.startsWith("image/")
        ) {

            continue;

        }


        const img =
            document.createElement("img");


        const objectUrl =
            URL.createObjectURL(file);


        img.src =
            objectUrl;


        img.alt =
            "Evidence photo";


        img.onload = () => {

            URL.revokeObjectURL(
                objectUrl
            );

        };


        preview.appendChild(img);

    }

}


/* ================================================================
   LOCATION
   ================================================================ */


locationBtn.addEventListener(
    "click",
    detectLocation
);


function detectLocation() {


    if (!navigator.geolocation) {

        alert(
            "GPS is not supported by this browser."
        );

        return;

    }


    locationText.textContent =
        "Detecting location...";


    locationBtn.disabled =
        true;


    navigator.geolocation.getCurrentPosition(

        position => {


            const lat =
                position.coords.latitude;


            const lng =
                position.coords.longitude;


            /*
             * Store coordinates.
             */

            latitude.value =
                lat;


            longitude.value =
                lng;


            /*
             * Store simple address.
             *
             * You can later replace this with
             * reverse geocoding.
             */

            address.value =
                `${lat}, ${lng}`;


            locationText.textContent =
                `Location detected: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;


            locationBtn.disabled =
                false;

        },


        error => {


            console.error(
                "Location error:",
                error
            );


            locationText.textContent =
                "Could not detect location";


            locationBtn.disabled =
                false;


            if (error.code === 1) {

                alert(
                    "Location permission was denied. Please allow location access."
                );

            }

        },


        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

    );

}


/* ================================================================
   MAP BUTTON
   ================================================================ */


document.getElementById("mapBtn")
    .addEventListener("click", () => {

        const map =
            document.getElementById("map");


        if (map.style.display === "none" ||
            map.style.display === "") {

            map.style.display =
                "block";


            /*
             * Map integration can be added here.
             *
             * Example:
             * Leaflet / Google Maps / Mapbox
             */

            map.innerHTML = `

                <div style="
                    padding:20px;
                    text-align:center;
                    background:#f5f5f5;
                    border-radius:10px;
                ">

                    🗺️ Map selection can be
                    integrated here.

                    <br><br>

                    Use "Detect My Location"
                    for automatic GPS coordinates.

                </div>

            `;

        }

    });


/* ================================================================
   FORM SUBMISSION
   ================================================================ */


form.addEventListener(
    "submit",
    async event => {


        event.preventDefault();


        const button =
            document.getElementById(
                "submitBtn"
            );


        /*
         * Prevent duplicate submissions.
         */

        button.disabled =
            true;


        button.textContent =
            "Analyzing...";


        result.innerHTML = `

            <div class="success-box">

                🤖 AI is analyzing your problem...

            </div>

        `;


        try {


            /*
             * Create FormData.
             *
             * This includes:
             *
             * title
             * description
             * images
             * latitude
             * longitude
             * address
             */

            const data =
                new FormData(form);


            /* ======================================================
               CREATE PROBLEM
               ====================================================== */


            const response =
                await fetch(

                    "/api/problems",

                    {

                        method: "POST",

                        body: data,

                        credentials:
                            "same-origin"

                    }

                );


            const created =
                await response.json();


            if (!response.ok) {


                throw new Error(

                    created.message ||
                    created.error ||
                    "Failed to submit problem"

                );

            }


            const problemId =
                created.problem_id;


            /* ======================================================
               AI ANALYSIS
               ====================================================== */


            result.innerHTML = `

                <div class="success-box">

                    🤖 Problem created.

                    <br>

                    🔍 Running AI analysis...

                </div>

            `;


            const analysisResponse =
                await fetch(

                    `/api/problems/${problemId}/analyze`,

                    {

                        method: "POST",

                        credentials:
                            "same-origin"

                    }

                );


            const analysis =
                await analysisResponse.json();


            if (!analysisResponse.ok) {


                throw new Error(

                    analysis.error ||
                    "AI analysis failed"

                );

            }


            /* ======================================================
               SHOW RESULT
               ====================================================== */


            const category =
                analysis.classification?.category ||
                "Unknown";


            const priority =
                analysis.priority?.level ||
                "Medium";


            const evidenceScore =
                analysis.evidence_score ||
                0;


            result.innerHTML = `

                <div class="success-box">

                    <h3>
                        ✅ Analysis Complete
                    </h3>


                    <p>
                        Problem ID:
                        <strong>
                            #${problemId}
                        </strong>
                    </p>


                    <p>
                        Category:
                        <strong>
                            ${category}
                        </strong>
                    </p>


                    <p>
                        Priority:
                        <strong>
                            ${priority}
                        </strong>
                    </p>


                    <p>
                        Evidence Score:
                        <strong>
                            ${evidenceScore}%
                        </strong>
                    </p>

                </div>

            `;


            button.textContent =
                "Analyzed ✓";


        }

        catch (error) {


            console.error(
                "Submission error:",
                error
            );


            result.innerHTML = `

                <div class="error-box">

                    ❌ ${error.message}

                </div>

            `;


            button.disabled =
                false;


            button.textContent =
                "Submit & Analyze";

        }

    });


</script>

</body>

</html>
