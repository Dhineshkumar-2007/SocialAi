<body>

<header class="header">
    <h1>Report a Problem</h1>
    <p>Help your community by reporting real-world problems.</p>
</header>

<main class="container">

    <div class="card">

        <form id="problemForm">

            <!-- TITLE -->
            <div class="field">
                <label for="title">Problem Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Non-functional streetlight"
                    required
                    maxlength="200"
                >
            </div>

            <!-- DESCRIPTION -->
            <div class="field">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the problem clearly..."
                    required
                    maxlength="5000"
                ></textarea>
            </div>

            <!-- EVIDENCE -->
            <div class="field">

                <label>Evidence Photo</label>

                <div class="evidence-buttons">

                    <!-- CAMERA -->
                    <button
                        type="button"
                        class="btn-primary"
                        id="cameraButton"
                    >
                        📷 Camera
                    </button>

                    <!-- GALLERY -->
                    <button
                        type="button"
                        class="btn-secondary"
                        id="galleryButton"
                    >
                        🖼️ Gallery
                    </button>

                </div>

                <!--
                    IMPORTANT:

                    Camera input:
                    capture="environment"

                    Gallery input:
                    NO capture attribute
                -->

                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >

                <input
                    type="file"
                    id="evidenceInput"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    hidden
                >

                <div class="small-text">
                    Add photos that provide evidence for the reported problem.
                </div>

                <!-- CAMERA -->
                <div
                    class="camera-container"
                    id="cameraContainer"
                >

                    <video
                        id="cameraVideo"
                        autoplay
                        playsinline
                    ></video>

                    <div class="camera-controls">

                        <button
                            type="button"
                            class="btn-primary"
                            id="captureButton"
                        >
                            📸 Capture
                        </button>

                        <button
                            type="button"
                            class="btn-danger"
                            id="stopCameraButton"
                        >
                            ✕ Close
                        </button>

                    </div>

                </div>

                <canvas
                    id="cameraCanvas"
                    hidden
                ></canvas>

                <!-- PREVIEW -->
                <div
                    class="preview-grid"

                ></div>

            </div>

            <!-- LOCATION -->
            <div class="field">

                <label>Location</label>

                <div class="location-box">

                    <button

                        class="btn-secondary"
                        id="locationButton"

                        📍 Detect Location

            <input
                type="hidden"
                id="latitude"
                name="latitude"

            <input
                type="hidden"

            >

                type="hidden"
                id="address"
                name="address"

            <!-- SUBMIT -->

            <div class="analysis-row">

                    -

            <div class="analysis-row">
                <span class="analysis-label">

                    class="score"

                    -

            </div>

            <div class="analysis-row">

</main>


<script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const form = document.getElementById("problemForm");

    const titleInput =
        document.getElementById("title");

    const descriptionInput =
        document.getElementById("description");

    const cameraButton =
        document.getElementById("cameraButton");

    const galleryButton =
        document.getElementById("galleryButton");

    const cameraInput =
        document.getElementById("cameraInput");

    const evidenceInput =
        document.getElementById("evidenceInput");

    const cameraContainer =
        document.getElementById("cameraContainer");

    const cameraVideo =
        document.getElementById("cameraVideo");

    const cameraCanvas =
        document.getElementById("cameraCanvas");

    const captureButton =
        document.getElementById("captureButton");

    const stopCameraButton =
        document.getElementById("stopCameraButton");

    const previewGrid =
        document.getElementById("previewGrid");

    const locationButton =
        document.getElementById("locationButton");

    const locationText =
        document.getElementById("locationText");

    const locationStatus =
        document.getElementById("locationStatus");

    const latitude =
        document.getElementById("latitude");

    const longitude =
        document.getElementById("longitude");

    const address =
        document.getElementById("address");

    const submitButton =
        document.getElementById("submitButton");

    const statusBox =
        document.getElementById("status");

    const analysisCard =
        document.getElementById("analysisCard");

    const analysisCategory =
        document.getElementById("analysisCategory");

    const analysisPriority =
        document.getElementById("analysisPriority");

    const analysisEvidence =
        document.getElementById("analysisEvidence");

    const analysisUniversity =
        document.getElementById("analysisUniversity");


    /* =========================================================
       STATE
    ========================================================= */

    let cameraStream = null;

    let selectedFiles = [];


    /* =========================================================
       STATUS
    ========================================================= */

    function showStatus(message, type = "info") {

        statusBox.className = "status " + type;

        statusBox.textContent = message;

        statusBox.style.display = "block";
    }


    function hideStatus() {

        statusBox.style.display = "none";

        statusBox.textContent = "";

    }


    /* =========================================================
       CAMERA
    ========================================================= */

    cameraButton.addEventListener("click", async () => {

        /*
         * First try browser camera API.
         */

        if (
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        ) {

            try {

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });

                cameraVideo.srcObject =
                    cameraStream;

                cameraContainer.style.display =
                    "block";

                return;

            } catch (error) {

                console.warn(
                    "getUserMedia failed:",
                    error
                );

            }

        }

        /*
         * Fallback to native camera input.
         *
         * This is ONLY used by Camera button.
         */

        cameraInput.click();

    });


    /* =========================================================
       CAPTURE CAMERA PHOTO
    ========================================================= */

    captureButton.addEventListener("click", () => {

        if (!cameraStream) {
            return;
        }

        const videoWidth =
            cameraVideo.videoWidth;

        const videoHeight =
            cameraVideo.videoHeight;

        if (!videoWidth || !videoHeight) {

            showStatus(
                "Camera is not ready yet. Please wait a moment.",
                "error"
            );

            return;
        }

        cameraCanvas.width =
            videoWidth;

        cameraCanvas.height =
            videoHeight;

        const context =
            cameraCanvas.getContext("2d");

        context.drawImage(
            cameraVideo,
            0,
            0,
            videoWidth,
            videoHeight
        );

        cameraCanvas.toBlob(
            blob => {

                if (!blob) {

                    showStatus(
                        "Could not capture image.",
                        "error"
                    );

                    return;
                }

                const file = new File(
                    [blob],
                    `camera_${Date.now()}.jpg`,
                    {
                        type: "image/jpeg"
                    }
                );

                selectedFiles.push(file);

                renderPreviews();

                stopCamera();

            },
            "image/jpeg",
            0.9
        );

    });


    /* =========================================================
       STOP CAMERA
    ========================================================= */

    stopCameraButton.addEventListener(
        "click",
        stopCamera
    );


    function stopCamera() {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(track => track.stop());

            cameraStream = null;

        }

        cameraVideo.srcObject = null;

        cameraContainer.style.display =
            "none";

    }


    /* =========================================================
       CAMERA NATIVE INPUT
    ========================================================= */

    cameraInput.addEventListener(
        "change",
        event => {

            const files =
                Array.from(event.target.files || []);

            if (files.length > 0) {

                selectedFiles.push(
                    ...files
                );

                renderPreviews();

            }

            /*
             * Reset input so the same image
             * can be selected again.
             */

            cameraInput.value = "";

        }
    );


    /* =========================================================
       GALLERY
    ========================================================= */

    galleryButton.addEventListener(
        "click",
        () => {

            /*
             * IMPORTANT:
             * No cameraInput here.
             */

            evidenceInput.click();

        }
    );


    evidenceInput.addEventListener(
        "change",
        event => {

            const files =
                Array.from(event.target.files || []);

            if (files.length > 0) {

                selectedFiles.push(
                    ...files
                );

                renderPreviews();

            }

            /*
             * Reset input.
             */

            evidenceInput.value = "";

        }
    );


    /* =========================================================
       PREVIEW
    ========================================================= */

    function renderPreviews() {

        previewGrid.innerHTML = "";

        selectedFiles.forEach(
            (file, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "preview-item";

                const img =
                    document.createElement("img");

                img.src =
                    URL.createObjectURL(file);

                img.alt =
                    "Evidence photo";

                const removeButton =
                    document.createElement("button");

                removeButton.type =
                    "button";

                removeButton.className =
                    "remove-image";

                removeButton.textContent =
                    "×";

                removeButton.addEventListener(
                    "click",
                    () => {

                        selectedFiles.splice(
                            index,
                            1
                        );

                        renderPreviews();

                    }
                );

                item.appendChild(img);

                item.appendChild(
                    removeButton
                );

                previewGrid.appendChild(item);

            }
        );

    }


    /* =========================================================
       LOCATION
    ========================================================= */

    locationButton.addEventListener(
        "click",
        detectLocation
    );


    function detectLocation() {

        if (!navigator.geolocation) {

            locationStatus.textContent =
                "Geolocation is not supported by this browser.";

            return;

        }

        locationStatus.textContent =
            "Detecting your location...";

        locationButton.disabled = true;

        navigator.geolocation.getCurrentPosition(

            position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                latitude.value =
                    lat;

                longitude.value =
                    lng;

                /*
                 * Store coordinates as address fallback.
                 *
                 * Backend accepts address separately.
                 */

                address.value =
                    `${lat}, ${lng}`;

                locationText.textContent =
                    `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

                locationStatus.textContent =
                    "Location detected successfully.";

                locationButton.disabled =
                    false;

            },

            error => {

                console.error(
                    "Location error:",
                    error
                );

                locationStatus.textContent =
                    "Unable to detect location. You can still submit the report.";

                locationButton.disabled =
                    false;

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 60000
            }

        );

    }


    /* =========================================================
       JSON RESPONSE HELPER
       ========================================================= */

    async function readResponse(response) {

        /*
         * Read text FIRST.
         *
         * This prevents:
         *
         * Unexpected token '<'
         *
         * when Flask returns HTML.
         */

        const text =
            await response.text();

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";

        console.log(
            "HTTP STATUS:",
            response.status
        );

        console.log(
            "CONTENT TYPE:",
            contentType
        );

        console.log(
            "RAW RESPONSE:",
            text
        );


        /*
         * Empty response
         */

        if (!text.trim()) {

            throw new Error(
                `Server returned an empty response (${response.status}).`
            );

        }


        /*
         * Detect HTML.
         */

        if (
            text.trim().startsWith("<") ||
            contentType.includes("text/html")
        ) {

            let message =
                `Server returned HTML instead of JSON. HTTP ${response.status}.`;

            if (response.status === 404) {

                message +=
                    "\nPossible cause: API route not found.";

            }

            else if (
                response.status === 401
            ) {

                message +=
                    "\nYou are not logged in.";

            }

            else if (
                response.status === 403
            ) {

                message +=
                    "\nYou do not have permission to access this route.";

            }

            else if (
                response.status >= 500
            ) {

                message +=
                    "\nThe Flask server encountered an error.";

            }

            console.error(
                "HTML RESPONSE:",
                text
            );

            throw new Error(message);

        }


        /*
         * Parse JSON.
         */

        let data;

        try {

            data =
                JSON.parse(text);

        } catch (error) {

            console.error(
                "JSON PARSE ERROR:",
                error
            );

            console.error(
                "SERVER RESPONSE:",
                text
            );

            throw new Error(
                `Invalid JSON response from server (HTTP ${response.status}).`
            );

        }


        /*
         * HTTP error
         */

        if (!response.ok) {

            const message =
                data.message ||
                data.error ||
                data.detail ||
                `Request failed with HTTP ${response.status}.`;

            const err =
                new Error(message);

            err.data =
                data;

            err.status =
                response.status;

            throw err;

        }


        return data;

    }


    /* =========================================================
       SUBMIT PROBLEM
    ========================================================= */

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            hideStatus();

            analysisCard.classList.remove(
                "show"
            );


            /*
             * Validate fields.
             */

            const title =
                titleInput.value.trim();

            const description =
                descriptionInput.value.trim();


            if (!title) {

                showStatus(
                    "Please enter a problem title.",
                    "error"
                );

                titleInput.focus();

                return;

            }


            if (!description) {

                showStatus(
                    "Please describe the problem.",
                    "error"
                );

                descriptionInput.focus();

                return;

            }


            /*
             * Disable submit.
             */

            submitButton.disabled =
                true;

            submitButton.textContent =
                "⏳ Submitting...";


            try {

                /*
                 * IMPORTANT:
                 *
                 * Do NOT manually set
                 * Content-Type.
                 *
                 * Browser automatically sets
                 * multipart/form-data boundary.
                 */

                const formData =
                    new FormData();

                formData.append(
                    "title",
                    title
                );

                formData.append(
                    "description",
                    description
                );


                /*
                 * Location
                 */

                if (latitude.value) {

                    formData.append(
                        "latitude",
                        latitude.value
                    );

                }

                if (longitude.value) {

                    formData.append(
                        "longitude",
                        longitude.value
                    );

                }

                if (address.value) {

                    formData.append(
                        "address",
                        address.value
                    );

                }


                /*
                 * Evidence
                 *
                 * Backend expects:
                 *
                 * request.files.getlist("evidence")
                 */

                selectedFiles.forEach(
                    file => {

                        formData.append(
                            "evidence",
                            file,
                            file.name
                        );

                    }
                );


                console.log(
                    "Submitting problem..."
                );

                console.log(
                    "Files:",
                    selectedFiles
                );


                /*
                 * POST /api/problems
                 */

                const response =
                    await fetch(
                        "/api/problems",
                        {
                            method: "POST",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            credentials:
                                "same-origin",

                            body:
                                formData
                        }
                    );


                const data =
                    await readResponse(
                        response
                    );


                console.log(
                    "CREATE PROBLEM RESPONSE:",
                    data
                );


                const problemId =
                    data.problem_id;


                if (!problemId) {

                    throw new Error(
                        "Problem was submitted but server did not return problem_id."
                    );

                }


                showStatus(
                    `Problem submitted successfully.\nProblem ID: ${problemId}\n\nStarting AI analysis...`,
                    "info"
                );


                /*
                 * AI ANALYSIS
                 */

                submitButton.textContent =
                    "🤖 AI Analyzing...";


                const analysisResponse =
                    await fetch(
                        `/api/problems/${problemId}/analyze`,
                        {
                            method: "POST",

                            headers: {
                                "Accept":
                                    "application/json"
                            },

                            credentials:
                                "same-origin"
                        }
                    );


                const analysis =
                    await readResponse(
                        analysisResponse
                    );


                console.log(
                    "AI ANALYSIS:",
                    analysis
                );


                /*
                 * Display AI result.
                 */

                displayAnalysis(
                    analysis
                );


                showStatus(
                    "✅ Problem submitted and AI analysis completed successfully.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "SUBMISSION ERROR:",
                    error
                );


                let message =
                    error.message ||
                    "Something went wrong.";


                /*
                 * Special authentication errors.
                 */

                if (
                    error.status === 401
                ) {

                    message =
                        "🔐 Authentication required.\nPlease log in and try again.";

                }


                if (
                    error.status === 403
                ) {

                    message =
                        "⛔ You do not have permission to submit this problem.";

                }


                showStatus(
                    "❌ " + message,
                    "error"
                );

            } finally {

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "🚀 Submit Problem";

            }

        }
    );


    /* =========================================================
       DISPLAY AI ANALYSIS
    ========================================================= */

    function displayAnalysis(data) {

        analysisCard.classList.add(
            "show"
        );


        /*
         * Category
         */

        analysisCategory.textContent =
            getValue(
                data,
                [
                    "category",
                    "classification",
                    "problem_category"
                ]
            );


        /*
         * Priority
         */

        analysisPriority.textContent =
            getValue(
                data,
                [
                    "priority",
                    "priority_level"
                ]
            );


        /*
         * Evidence
         */

        let evidence =
            getValue(
                data,
                [
                    "evidence_score",
                    "evidenceScore",
                    "similarity",
                    "image_similarity"
                ]
            );


        if (
            typeof evidence === "number"
        ) {

            /*
             * If model returns 0.3949,
             * display 39.5%.
             *
             * If model returns 39.49,
             * display 39.5%.
             */

            if (evidence <= 1) {

                evidence =
                    evidence * 100;

            }

            evidence =
                evidence.toFixed(1) + "%";

        }


        analysisEvidence.textContent =
            evidence || "-";


        /*
         * University
         */

        let university = "-";


        if (
            data.auto_assignment
        ) {

            university =
                data.auto_assignment.university ||
                data.auto_assignment.university_name ||
                "-";

        }


        if (
            university === "-" &&
            data.university
        ) {

            university =
                data.university;

        }


        analysisUniversity.textContent =
            university;

    }


    /* =========================================================
       GET VALUE HELPER
    ========================================================= */

    function getValue(
        object,
        keys
    ) {

        for (
            const key of keys
        ) {

            if (
                object[key] !== undefined &&
                object[key] !== null &&
                object[key] !== ""
            ) {

                return object[key];

            }

        }

        return "-";

    }


    /* =========================================================
       PAGE LOAD
    ========================================================= */

    window.addEventListener(
        "beforeunload",
        () => {

            stopCamera();

        }
    );

</script>
