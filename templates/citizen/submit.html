<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Problem · Social AI</title>

    <link rel="stylesheet" href="/static/css/social-ai.css">

    <style>
        .report-box {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
            box-sizing: border-box;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        #cameraPreview {
            width: 100%;
            max-height: 300px;
            border-radius: 10px;
            background: #000;
            object-fit: cover;
            margin-top: 10px;
        }

        .preview img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .location-box {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #map {
            height: 300px;
            margin-top: 15px;
            display: none;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="app">

    <main class="main">

        <div class="report-box panel">

            <h1>Report a Community Problem</h1>

            <p>
                Submit the problem and Social AI will analyze it
                and find suitable institutions.
            </p>

            <form id="problemForm" enctype="multipart/form-data">

                <!-- TITLE -->
                <div class="field">
                    <label>Problem Title</label>

                    <input
                        type="text"
                        name="title"
                        placeholder="Example: Streetlights not working near bus stop"
                        required
                    >
                </div>


                <!-- DESCRIPTION -->
                <div class="field">

                    <label>What is happening?</label>

                    <textarea
                        name="description"
                        placeholder="Describe the problem, location and people affected..."
                        required
                    ></textarea>

                </div>


                <!-- IMAGE -->
                <div class="field">

                    <label>Evidence Photo</label>

                    <div class="buttons">

                        <button
                            type="button"
                            id="cameraBtn"
                            class="btn btn-ghost"
                        >
                            📷 Camera
                        </button>

                        <label
                            for="evidenceInput"
                            class="btn btn-ghost"
                        >
                            🖼️ Upload
                        </label>

                    </div>

                    <input
                        type="file"
                        id="evidenceInput"
                        name="evidence"
                        accept="image/*"
                        multiple
                        hidden
                    >

                    <input
                        type="file"
                        id="cameraInput"
                        accept="image/*"
                        capture="environment"
                        hidden
                    >

                    <video id="cameraPreview" autoplay playsinline muted hidden></video>

                    <div class="buttons">
                        <button
                            type="button"
                            id="captureBtn"
                            class="btn btn-primary"
                            hidden
                        >
                            📸 Capture Photo
                        </button>

                        <button
                            type="button"
                            id="stopCameraBtn"
                            class="btn btn-ghost"
                            hidden
                        >
                            ✋ Stop Camera
                        </button>
                    </div>

                    <div id="preview" class="preview"></div>

                </div>


                <!-- LOCATION -->
                <div class="field">

                    <label>📍 Problem Location</label>

                    <div class="location-box">

                        <button
                            type="button"
                            id="locationBtn"
                            class="btn btn-ghost"
                        >
                            📍 Detect My Location
                        </button>

                        <button
                            type="button"
                            id="mapBtn"
                            class="btn btn-ghost"
                        >
                            🗺️ Choose on Map
                        </button>

                        <p id="locationText">
                            Location not selected
                        </p>

                    </div>

                    <input
                        type="hidden"
                        name="latitude"
                        id="latitude"
                    >

                    <input
                        type="hidden"
                        name="longitude"
                        id="longitude"
                    >

                    <input
                        type="hidden"
                        name="address"
                        id="address"
                    >

                    <div id="map"></div>

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="btn btn-primary"
                >
                    Submit & Analyze
                </button>

            </form>


            <!-- RESULT -->
            <div id="result"></div>

        </div>

    </main>

</div>


<script>

const form = document.getElementById("problemForm");

const cameraBtn = document.getElementById("cameraBtn");
const cameraInput = document.getElementById("cameraInput");

const evidenceInput = document.getElementById("evidenceInput");
const preview = document.getElementById("preview");

const cameraPreview = document.getElementById("cameraPreview");
const captureBtn = document.getElementById("captureBtn");
const stopCameraBtn = document.getElementById("stopCameraBtn");

const isMobile = /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i
    .test(navigator.userAgent);

const locationBtn = document.getElementById("locationBtn");

const latitude = document.getElementById("latitude");
const longitude = document.getElementById("longitude");

const locationText = document.getElementById("locationText");

const result = document.getElementById("result");


// CAMERA — works on mobile and desktop: live preview + capture button.
// Falls back to the native camera capture input on mobile if getUserMedia
// is unavailable or denied.
cameraBtn.onclick = () => {
    openCamera();
};


function openCamera() {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

        if (isMobile) {

            cameraInput.click();
            return;
        }

        alert("Camera is not supported in this browser. Use the Upload button instead.");

        return;
    }

    // Prefer the rear camera on phones, mirroring capture="environment".
    getUserMedia({ facingMode: "environment" }).catch(() => {

        // Some desktop webcams don't expose facingMode — retry without it.
        return getUserMedia({});
    }).then(showCameraStream).catch(err => {

        if (isMobile) {

            // Native capture is more reliable when getUserMedia is denied.
            cameraInput.click();

        } else {

            alert("Could not access the camera: " + (err.message || err));

        }
    });
}


function getUserMedia(videoConstraints) {

    return navigator.mediaDevices.getUserMedia({
        video: videoConstraints,
        audio: false
    });
}


function showCameraStream(stream) {

    cameraPreview.srcObject = stream;
    cameraPreview.hidden = false;
    captureBtn.hidden = false;
    stopCameraBtn.hidden = false;

    cameraPreview.play().catch(() => {});
}


function stopCamera() {

    if (cameraPreview.srcObject) {

        cameraPreview.srcObject
            .getTracks()
            .forEach(track => track.stop());

        cameraPreview.srcObject = null;
    }

    cameraPreview.hidden = true;
    captureBtn.hidden = true;
    stopCameraBtn.hidden = true;
}


captureBtn.onclick = () => {

    if (!cameraPreview.videoWidth) return;

    const canvas = document.createElement("canvas");

    canvas.width = cameraPreview.videoWidth;
    canvas.height = cameraPreview.videoHeight;

    canvas.getContext("2d")
        .drawImage(cameraPreview, 0, 0);

    canvas.toBlob(blob => {

        const file = new File(
            [blob],
            `camera_${Date.now()}.jpg`,
            { type: "image/jpeg" }
        );

        const dataTransfer = new DataTransfer();

        for (const f of evidenceInput.files)
            dataTransfer.items.add(f);

        dataTransfer.items.add(file);

        evidenceInput.files = dataTransfer.files;

        showImages(evidenceInput.files);

    }, "image/jpeg", 0.9);
};


stopCameraBtn.onclick = stopCamera;


// CAMERA PHOTO (mobile native capture)
cameraInput.onchange = () => {

    if (cameraInput.files.length === 0)
        return;

    evidenceInput.files = cameraInput.files;

    showImages(evidenceInput.files);
};


// UPLOAD IMAGE
evidenceInput.onchange = () => {

    showImages(evidenceInput.files);

};


// IMAGE PREVIEW
function showImages(files) {

    preview.innerHTML = "";

    for (const file of files) {

        const img = document.createElement("img");

        img.src = URL.createObjectURL(file);

        preview.appendChild(img);
    }
}


// LOCATION
locationBtn.onclick = () => {

    if (!navigator.geolocation) {

        alert("GPS is not supported");

        return;
    }

    locationText.textContent = "Detecting location...";

    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            latitude.value = lat;
            longitude.value = lng;

            locationText.textContent =
                `Location detected: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

            address.value =
                `${lat}, ${lng}`;
        },

        () => {

            locationText.textContent =
                "Could not detect location";

        }
    );
};


// SUBMIT
form.onsubmit = async (event) => {

    event.preventDefault();

    const button = document.getElementById("submitBtn");

    button.disabled = true;

    button.textContent = "Analyzing...";

    result.innerHTML = "AI is analyzing your problem...";


    try {

        const data = new FormData(form);


        // CREATE PROBLEM
        const response = await fetch(
            "/api/problems",
            {
                method: "POST",
                body: data,
                credentials: "same-origin"
            }
        );


        const created = await response.json();


        if (!response.ok) {

            throw new Error(
                created.message || created.error || "Failed to submit problem"
            );
        }


        const problemId = created.problem_id;


        // AI ANALYSIS
        const analysisResponse = await fetch(
            `/api/problems/${problemId}/analyze`,
            {
                method: "POST",
                credentials: "same-origin"
            }
        );


        const analysis = await analysisResponse.json();


        if (!analysisResponse.ok) {

            throw new Error(
                analysis.error || "AI analysis failed"
            );
        }


        // SHOW RESULT
        result.innerHTML = `

            <div class="success-box">

                <h3>✅ Analysis Complete</h3>

                <p>
                    Problem ID: <strong>#${problemId}</strong>
                </p>

                <p>
                    Category:
                    <strong>
                        ${analysis.classification?.category || "Unknown"}
                    </strong>
                </p>

                <p>
                    Priority:
                    <strong>
                        ${analysis.priority?.level || "Medium"}
                    </strong>
                </p>

                <p>
                    Evidence Score:
                    <strong>
                        ${analysis.evidence_score || 0}%
                    </strong>
                </p>

            </div>

        `;


        button.textContent = "Analyzed ✓";


    } catch (error) {

        result.innerHTML = `

            <div class="error-box">

                ❌ ${error.message}

            </div>

        `;

        button.disabled = false;

        button.textContent = "Submit & Analyze";
    }

};

</script>

</body>
</html>
