<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Logs · Social AI</title><link rel="stylesheet" href="/static/css/social-ai.css"></head>
<body data-user-name="{{ user_name or '' }}"><div class="app">
<aside class="side"><a class="logo" href="/"><span class="logo-mark">S</span>Social AI</a><nav><a href="/admin">Dashboard</a><a href="/admin/users">Users</a><a href="/admin/institutions">Institutions</a><a href="/admin/problems">Problems</a><a href="/admin/ai">AI</a><a class="active" href="#">Audit Logs</a></nav></aside>
<main class="main">
<div class="top"><div><h1>Audit Logs</h1><p>Every significant action on the platform.</p></div><span class="tag green">● Monitoring</span></div>
<section class="panel">
<h3>Recent actions</h3>
<div id="auditList" style="margin-top:12px">
  <p style="color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px">Loading audit log…</p>
</div>
</section>
</main></div></body>
<script>
(async function(){
  try {
    const r = await fetch('/api/admin/audit', {credentials:'same-origin'});
    const data = await r.json().catch(()=>({}));
    const list = document.getElementById('auditList');
    if(!r.ok || !data.logs || !data.logs.length) {
      list.innerHTML = '<p style="color:var(--muted);padding:14px;text-align:center">No audit entries yet.</p>';
      return;
    }
    list.innerHTML = '<table style="width:100%;font-size:13px;border-collapse:collapse">' +
      '<thead style="background:#f7f9f8"><tr><th style="text-align:left;padding:8px">Time</th><th>Action</th><th>Actor</th><th>Target</th><th>Status</th></tr></thead><tbody>' +
      data.logs.map(l => '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px">' + (l.time||'') + '</td><td>' + (l.action||'') + '</td><td>' + (l.actor||'System') + '</td><td>' + (l.target||'') + '</td><td><span class="tag ' + (l.status==='success'?'green':l.status==='pending'?'amber':'green') + '">' + (l.status||'') + '</span></td></tr>').join('') +
      '</tbody></table>';
  } catch(e) {
    document.getElementById('auditList').innerHTML = '<p style="color:var(--muted);padding:14px">Could not load audit log.</p>';
  }
})();
</script>
</html>
