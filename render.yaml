services:
  # ─── Web service ──────────────────────────────────────────────────────────
  - type: web
    name: societal-ai-web
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: |
      pip install --upgrade pip && \
      pip install --no-cache-dir -r requirements.txt && \
      python -c "from PIL import Image; print('PIL OK')"
    startCommand: gunicorn -b 0.0.0.0:$PORT --timeout 120 --keep-alive 65 --workers 2 --threads 2 --max-requests 500 --max-requests-jitter 50 --access-logfile - --error-logfile - --preload app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: SOCIALAI_SKIP_WARMUP
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: societal-ai-db
          property: connectionString
      - key: AI_ENABLED
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_CONTENT_LENGTH
        value: "10485760"
      - key: CORS_ORIGINS
        value: "*"
      - key: UNIVERSITY_RESPONSE_TIMEOUT_HOURS
        value: "72"
      - key: MAX_ASSIGNMENT_ROUNDS
        value: "5"
      - key: HF_TOKEN
        sync: false
      - key: BGE_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CLASSIFIER_MODEL
        value: MoritzLaurer/distilbert-base-mnli
      - key: VISION_MODEL
        value: nlpconnect/vit-gpt2-image-captioning

  # ─── Postgres database (persistent storage) ─────────────────────────────
  - type: pserv
    name: societal-ai-db
    plan: starter
    region: oregon
    ipAllowList: []
    databaseName: societal_ai
    databaseUser: societal
    postgresMajorVersion: "16"

  # ─── Cron job: timeout scanner (replaces in-process scheduler) ──────────
  - type: cron
    name: timeout-scanner
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/timeout_scanner.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: societal-ai-db
          property: connectionString
      - key: UNIVERSITY_RESPONSE_TIMEOUT_HOURS
        value: "72"
      - key: PYTHONUNBUFFERED
        value: "1"
